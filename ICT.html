<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jTECH IT Learning Platform</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --accent: #38bdf8;
      --card-bg: rgba(30, 41, 59, 0.85);
      --border: rgba(255,255,255,0.1);
      --success: #10b981;
    }

    .light-mode {
      --bg-primary: #f8fafc;
      --bg-secondary: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --accent: #0ea5e9;
      --card-bg: rgba(255, 255, 255, 0.95);
      --border: rgba(0,0,0,0.1);
      --success: #059669;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.4s, color 0.4s;
      min-height: 100vh;
      padding-bottom: 70px;
      position: relative;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--bg-secondary);
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
      margin: 0 15px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      font-size: 0.95rem;
    }

    .nav-right {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .theme-toggle, .progress-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .progress-badge {
      background: var(--accent);
      color: var(--bg-primary);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Progress Panel */
    #progressPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .progress-content {
      background: var(--bg-primary);
      width: 90%;
      max-width: 500px;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      max-height: 80vh;
      overflow-y: auto;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-progress {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
    }

    .progress-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: var(--card-bg);
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .progress-item.completed {
      color: var(--success);
    }

    /* Certificate Button */
    .cert-btn {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      display: none;
      width: 100%;
    }

    .cert-btn.show {
      display: block;
    }

    /* Main Layout */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .motto {
      color: var(--accent);
      font-style: italic;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    .author {
      font-size: 0.92rem;
      opacity: 0.85;
    }

    /* Sections */
    #home, #lessons, #quiz {
      display: none;
    }

    .active {
      display: block !important;
    }

    /* Module Grid */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }

    .module-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 18px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 0;
      transform: translateY(15px);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
    }

    .module-card.completed::after {
      content: "✓";
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--success);
      color: var(--bg-primary);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .module-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .module-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .module-card i {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .module-card h2 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .module-card p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    /* Lesson Page */
    .lesson-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .lesson-header h2 {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .lesson-image {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      margin: 16px 0;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-style: italic;
      font-size: 0.95rem;
    }

    .lesson-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      line-height: 1.6;
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .lesson-content p, .lesson-content ul {
      margin-bottom: 14px;
    }

    .back-btn {
      margin-top: 20px;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      background: var(--accent);
      color: white;
    }

    /* Quiz */
    .quiz-container {
      background: var(--card-bg);
      padding: 22px;
      border-radius: 14px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .timer {
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: bold;
    }

    .quiz-question {
      font-size: 1.2rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option {
      padding: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .option:hover {
      background: rgba(255,255,255,0.15);
    }

    .option.selected {
      background: var(--accent);
      color: white;
    }

    .quiz-controls {
      margin-top: 10px;
    }

    #submitBtn {
      background: var(--accent);
      color: white;
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    #result {
      margin-top: 20px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    /* Mascot */
    #mascot {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 90px;
      height: 90px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="20" fill="%23FFD700"/><circle cx="40" cy="35" r="3" fill="black"/><circle cx="60" cy="35" r="3" fill="black"/><path d="M40 60 Q50 70 60 60" stroke="black" stroke-width="2" fill="none"/><rect x="30" y="70" width="40" height="20" fill="%23FF6347"/><rect x="25" y="70" width="10" height="20" fill="%234682B4"/><rect x="65" y="70" width="10" height="20" fill="%234682B4"/></svg>') no-repeat center;
      background-size: contain;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0);
      transition: opacity 0.5s, transform 0.5s;
    }

    .dance {
      animation: dance 1.5s infinite alternate;
    }

    @keyframes dance {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(10deg); }
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 16px;
      color: var(--text-secondary);
      font-size: 0.88rem;
    }

    /* Mobile */
    @media (max-width: 600px) {
      nav {
        padding: 12px;
        flex-direction: column;
        gap: 12px;
      }
      .logo {
        font-size: 1.4rem;
      }
      .search-box {
        width: 100%;
        max-width: none;
        margin: 10px 0;
      }
      h1 {
        font-size: 1.8rem;
      }
      .modules-grid {
        grid-template-columns: 1fr;
      }
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .cert-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <div class="logo">jTECH</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search lessons...">
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
      </button>
      <button onclick="showSection('home')">Home</button>
      <button onclick="showSection('lessons')">Lessons</button>
      <button onclick="loadQuiz()">Quiz</button>

      <a href="index.html"> 
        <i class="fas fa-book-open"></i>
        <b><i><span style="font-size:19px; color:gold; text-align:center">Back to Portfolio💼</span></i></b>
      </a>  
    </div>
  </nav>
 
  <!-- Home Section -->
  <div id="home" class="container active">
    <header>
      <h1>jTECH IT Learning Platform</h1>
      <p class="motto">"Code Your Future"</p>
      <p class="author">By Joel A Asamoah</p>
    </header>
    <div class="modules-grid" id="modulesContainer">
      <!-- Modules injected by JS -->
    </div>
  </div>

  <!-- Lessons Section -->
  <div id="lessons" class="container">
    <div class="lesson-header">
      <i class="fas fa-book"></i>
      <h2 id="lessonTitle">Lesson</h2>
    </div>
    <div class="lesson-content" id="lessonContent">
      Select a lesson from the home page.
    </div>
    <button class="back-btn" onclick="showSection('home')">← Back to Modules</button>
  </div>

  <!-- Quiz Section -->
  <div id="quiz" class="container">
    <h2><i class="fas fa-graduation-cap"></i> Quick Quiz</h2>
    <div class="quiz-container">
      <div class="quiz-question" id="quizQuestion">Loading...</div>
      <div class="options" id="quizOptions"></div>
      <div class="quiz-controls">
        <button id="submitBtn" onclick="submitQuiz()">Submit</button>
      </div>
      <div id="result"></div>
    </div>
    <button class="back-btn" onclick="showSection('home')" style="margin-top: 20px;">← Back to Home</button>
  </div>

  <footer>
    <p>© 2009 jTECH by Joel A Asamoah | Code Your Future</p>
  </footer>

  <script>
    // --- Data ---
    const modules = [
      { id: 1, title: "Introduction To Information System", desc: "Understand how data, people, and technology work together to support decision-making in organizations.", icon: "fa-database" },
      { id: 2, title: "Introduction To Digital Technology", desc: "Explore the evolution and impact of digital tools on society, business, and education.", icon: "fa-microchip" },
      { id: 3, title: "Hardware Components", desc: "Learn about CPUs, RAM, motherboards, and other physical parts that make computers work.", icon: "fa-microchip" },
      { id: 4, title: "Primary and Secondary Storage Media And Devices", desc: "Differentiate between RAM, ROM, HDDs, SSDs, and cloud storage solutions.", icon: "fa-hdd" },
      { id: 5, title: "Data Representation", desc: "Discover how computers encode text, images, and sound using binary and other formats.", icon: "fa-code" },
      { id: 6, title: "Introduction To Computer Software", desc: "Understand system software, application software, and how they interact with hardware.", icon: "fa-laptop" },
      { id: 7, title: "Personal Computer Hardware Maintenance And Software Installation", desc: "Learn best practices for upgrading, cleaning, and installing operating systems and drivers.", icon: "fa-tools" },
      { id: 8, title: "Concepts And Terminologies In Integrating ICT In Education", desc: "Explore how digital tools enhance teaching, learning, and administrative processes in schools.", icon: "fa-graduation-cap" },
      { id: 9, title: "Spread Sheet Application", desc: "Master formulas, charts, and data analysis using tools like Microsoft Excel or Google Sheets.", icon: "fa-table" },
      { id: 10, title: "Introduction To Data Processing Systems", desc: "Understand batch, real-time, and distributed systems for handling large-scale data.", icon: "fa-server" },
      { id: 11, title: "Introduction To Programming", desc: "Get started with logic, algorithms, and your first lines of code in beginner-friendly languages.", icon: "fa-code" },
      { id: 12, title: "Introduction To Desktop Publishing Application", desc: "Create professional documents, flyers, and newsletters using tools like Canva or Adobe InDesign.", icon: "fa-file-alt" },
      { id: 13, title: "Introduction To Networking", desc: "Learn about LAN, WAN, protocols, IP addressing, and how devices communicate over networks.", icon: "fa-network-wired" },
      { id: 14, title: "Introduction To Website Designing", desc: "Build your first responsive webpage using HTML, CSS, and JavaScript—just like this platform!", icon: "fa-globe" }
    ];

    const lessons = {
      1: "<p>An <strong>Information System (IS)</strong> is a set of components that collect, process, store, and distribute information to support decision-making. Core components include hardware, software, data, people, and procedures.</p><p>Types include Transaction Processing Systems (TPS), Management Information Systems (MIS), and Decision Support Systems (DSS).</p>",
      2: "<p>Digital technology refers to electronic tools, systems, and devices that generate, store, or process data. Examples: smartphones, cloud computing, AI, IoT. It transforms communication, education, and business by enabling speed, connectivity, and automation.</p>",
      3: "<p>Key hardware components: <strong>CPU</strong> (brain), <strong>RAM</strong> (short-term memory), <strong>Motherboard</strong> (connects all parts), <strong>Power Supply</strong>, <strong>GPU</strong>, and <strong>Storage Drives</strong>.</p>",
      4: "<p><strong>Primary storage</strong> (RAM, cache) is volatile and fast. <strong>Secondary storage</strong> (HDD, SSD, USB, cloud) is non-volatile and used for long-term data retention.</p>",
      5: "<p>Computers represent data in <strong>binary</strong> (0s and 1s). Text uses ASCII/Unicode, images use pixels (RGB), audio uses sampling. Understanding binary, hex, and data units (bits, bytes) is essential.</p>",
      6: "<p><strong>System software</strong> (OS, drivers) manages hardware. <strong>Application software</strong> (browsers, editors) performs user tasks. Both rely on hardware to execute instructions.</p>",
      7: "<p>Hardware maintenance: clean dust, check connections, monitor temperatures. Software installation: use official sources, update drivers, create system restore points. Always back up data first!</p>",
      8: "<p>ICT in education includes digital whiteboards, LMS (e.g., Moodle), e-learning platforms, and assistive tech. Benefits: personalized learning, global collaboration, and resource accessibility.</p>",
      9: "<p>Spreadsheets organize data in rows/columns. Use formulas (SUM, AVERAGE), functions (VLOOKUP), charts, and pivot tables for analysis. Excel and Google Sheets are popular tools.</p>",
      10: "<p>Data processing systems convert raw data into meaningful information. Stages: input → processing → output → storage. Systems can be batch (scheduled) or real-time (instant).</p>",
      11: "<p>Programming involves writing instructions for computers. Start with concepts: variables, loops, conditionals, functions. Languages: Python (beginner-friendly), JavaScript, Java.</p>",
      12: "<p>Desktop publishing (DTP) combines text and graphics to create print/digital media. Tools: Adobe InDesign, Microsoft Publisher, Canva. Key elements: layout, typography, color theory.</p>",
      13: "<p>Networking connects devices to share resources. Key terms: IP address, router, switch, protocol (TCP/IP), bandwidth. Types: LAN (local), WAN (wide), Wi-Fi, Ethernet.</p>",
      14: "<p>Web design uses <strong>HTML</strong> (structure), <strong>CSS</strong> (style), and <strong>JavaScript</strong> (interactivity). Principles: responsiveness, accessibility, user experience (UX).</p>"
    };

    const quizData = [
      { q: "Which component is known as the 'brain' of the computer?", a: "CPU", opts: ["RAM", "Hard Drive", "CPU", "GPU"] },
      { q: "What does RAM stand for?", a: "Random Access Memory", opts: ["Read Access Memory", "Random Access Memory", "Read-Only Memory", "Rapid Access Module"] },
      { q: "Which is a secondary storage device?", a: "SSD", opts: ["Cache", "Registers", "RAM", "SSD"] },
      { q: "What language does a computer understand directly?", a: "Binary", opts: ["Python", "JavaScript", "Binary", "C++"] },
      { q: "Which software manages hardware and software resources?", a: "Operating System", opts: ["Web Browser", "Operating System", "Compiler", "Text Editor"] }
    ];

    // --- DOM Elements ---
    const themeToggle = document.getElementById('themeToggle');
    const searchInput = document.getElementById('searchInput');

    // --- Theme Toggle ---
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const icon = themeToggle.querySelector('i');
      if (document.body.classList.contains('light-mode')) {
        icon.className = 'fas fa-sun';
      } else {
        icon.className = 'fas fa-moon';
      }
    });

    // --- Navigation ---
    function showSection(sectionId) {
      document.querySelectorAll('div.container').forEach(el => el.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      if (sectionId === 'home') animateCards();
    }

    // --- Module Rendering ---
    function renderModules(list = modules) {
      const container = document.getElementById('modulesContainer');
      container.innerHTML = '';
      list.forEach(module => {
        const card = document.createElement('div');
        card.className = 'module-card';
        card.innerHTML = `
          <i class="fas ${module.icon}"></i>
          <h2>${module.title}</h2>
          <p>${module.desc}</p>
        `;
        card.onclick = () => loadLesson(module.id);
        container.appendChild(card);
      });
    }

    // --- Lesson Loading ---
    function loadLesson(id) {
      const module = modules.find(m => m.id === id);
      document.getElementById('lessonTitle').textContent = module.title;
      document.getElementById('lessonContent').innerHTML = lessons[id] || "<p>Lesson content coming soon!</p>";
      showSection('lessons');
    }

    // --- Search ---
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      if (!term) {
        renderModules();
        return;
      }
      const filtered = modules.filter(m => m.title.toLowerCase().includes(term) || m.desc.toLowerCase().includes(term));
      renderModules(filtered);
    });

    // --- Animations ---
    function animateCards() {
      setTimeout(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) entry.target.classList.add('visible');
          });
        }, { threshold: 0.1 });
        document.querySelectorAll('.module-card').forEach(card => observer.observe(card));
      }, 100);
    }

    // --- Quiz System ---
    let currentQuestion = 0;
    let userAnswers = [];
    let score = 0;

    function loadQuiz() {
      currentQuestion = 0;
      userAnswers = [];
      score = 0;
      document.getElementById('result').textContent = '';
      showSection('quiz');
      showQuestion();
    }

    function showQuestion() {
      const q = quizData[currentQuestion];
      document.getElementById('quizQuestion').textContent = q.q;
      const optionsEl = document.getElementById('quizOptions');
      optionsEl.innerHTML = '';
      q.opts.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => selectOption(div, opt);
        optionsEl.appendChild(div);
      });
      document.getElementById('submitBtn').textContent = currentQuestion === quizData.length - 1 ? "Finish" : "Next";
    }

    function selectOption(el, answer) {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      userAnswers[currentQuestion] = answer;
    }

    function submitQuiz() {
      if (userAnswers[currentQuestion] === undefined) {
        alert("Please select an answer!");
        return;
      }

      if (currentQuestion < quizData.length - 1) {
        currentQuestion++;
        showQuestion();
      } else {
        // Grade
        score = 0;
        quizData.forEach((q, i) => {
          if (userAnswers[i] === q.a) score++;
        });
        const percent = Math.round((score / quizData.length) * 100);
        document.getElementById('result').innerHTML = `
          <p>Your Score: ${score}/${quizData.length} (${percent}%)</p>
          <p style="color: ${percent >= 70 ? 'lightgreen' : 'orange'};">
            ${percent >= 70 ? 'Great job! 🎉' : 'Keep studying—you’ll get it! 💪'}
          </p>
        `;
      }
    }

    // --- Initialize ---
    renderModules();
    animateCards();
  </script>
</body>
</html>
